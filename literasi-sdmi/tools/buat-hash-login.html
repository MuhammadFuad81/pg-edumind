<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembuat Hash Login PG</title><style>body{font-family:system-ui;background:#f8fafc;padding:30px;color:#0f172a}.box{max-width:700px;margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:24px}input,button,textarea{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:12px}button{background:#4f46e5;color:#fff;border:0;font-weight:800;cursor:pointer}textarea{min-height:90px}</style></head><body><div class="box"><h1>Pembuat Hash Login</h1><p>Alat lokal untuk membuat SHA-256 username dan kata sandi. Setelah dibuat, ganti nilai <code>userHash</code> dan <code>passHash</code> pada HTML WSP.</p><label>Username</label><input id="u"><label>Kata sandi</label><input id="p" type="password"><button onclick="go()">Buat Hash</button><label>userHash</label><textarea id="uh" readonly></textarea><label>passHash</label><textarea id="ph" readonly></textarea></div><script>async function h(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function go(){uh.value=await h(u.value.trim());ph.value=await h(p.value)}</script></body></html>
